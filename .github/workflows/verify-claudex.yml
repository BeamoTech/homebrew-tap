name: Verify Claudex Homebrew package

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual release check only. This public tap uses the zero-billed GitHub macOS
# runner while Blacksmith access and queue time for this repository are unproven.
jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formula syntax
        run: ruby -c Formula/claudex.rb
      - name: Install and test the published formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          version=$(sed -nE 's/.*claudex-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz.*/\1/p' Formula/claudex.rb)
          test -n "$version"
          brew install BeamoINT/tap/claudex
          test "$(claudex --package-version)" = "$version"
          brew test BeamoINT/tap/claudex
          brew audit --strict --online BeamoINT/tap/claudex
